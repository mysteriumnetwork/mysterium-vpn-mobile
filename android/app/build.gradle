apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'

/**
 * Get the version code from command line param
 *
 * @return int If the param -PversionCode is present then return int value or 1
 */
def getVersionCode = { ->

    def code = project.hasProperty('versionCode') ? versionCode.toInteger() : 1

    println "VersionCode is set to $code"

    return code
}

/**
 * Get the version name from command line param
 *
 * @return string If the param -PversionName is present then return string value or "0.1"
 */
def getVersionName = { ->

    def name = project.hasProperty('versionName') ? versionName.toString() : "0.1"

    println "VersionName is set to $name"

    return name
}


android {
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }


    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId "network.mysterium.vpn"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode getVersionCode()
        versionName getVersionName()
        multiDexEnabled true
        ndk {
            debugSymbolLevel 'FULL'
            abiFilters "arm64-v8a", "armeabi-v7a", "armeabi", "x86", "x86_64"
        }

        buildConfigField "String", "BUGFENDER_KEY", "\"76DAzZtiLE5AYx7uvIWD8I16EqgReOHc\""
        buildConfigField "String", "NODE_VERSION", "\"${rootProject.ext.nodeVersion}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    flavorDimensions += "default"
    productFlavors {
        playstore {
            dimension = "default"
            buildConfigField "String", "BUILD_VARIANT", "\"playstore\""
        }
        crypto {
            dimension = "default"
            buildConfigField "String", "BUILD_VARIANT", "\"crypto\""
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    lint {
        abortOnError false
    }
    namespace 'network.mysterium.vpn'
}

dependencies {

    //Kotlin
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    //Testing
    testImplementation 'junit:junit:4.13.2'

    //AndroidX
    implementation "androidx.fragment:fragment-ktx:1.3.1"
    implementation "androidx.navigation:navigation-fragment-ktx:2.3.0"
    implementation "androidx.navigation:navigation-ui-ktx:2.3.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.1.0"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    //Google
    playstoreImplementation "com.google.android.play:review-ktx:2.0.1"
    implementation "com.google.android.material:material:1.12.0"
    playstoreImplementation "com.android.billingclient:billing-ktx:9.1.0"

    //Koin
    implementation "io.insert-koin:koin-core:3.1.6"
    implementation "io.insert-koin:koin-android:3.1.6"

    //Coroutines
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'

    //Animation
    implementation "com.airbnb.android:lottie:3.6.1"

    //Glide
    implementation "com.github.bumptech.glide:glide:4.12.0"

    //Intercom
    implementation "io.intercom.android:intercom-sdk-base:15.1.0"

    //Room
    implementation "androidx.room:room-ktx:2.7.2"
    implementation "androidx.room:room-runtime:2.7.2"
    ksp "androidx.room:room-compiler:2.7.2"

    //Line chart
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"

    //Rounded image
    implementation 'com.makeramen:roundedimageview:2.3.0'

    //Moshi
    implementation "com.squareup.moshi:moshi-kotlin:1.12.0"

    //QrCode
    cryptoImplementation 'com.journeyapps:zxing-android-embedded:4.1.0'

    //Markdown
    implementation "io.noties.markwon:core:4.6.2"

    //WorkManager
    implementation "androidx.work:work-runtime-ktx:2.7.1"

    //Fast scroll
    implementation "me.zhanghai.android.fastscroll:library:1.2.0"

    //Mysterium
    // Version comes from rootProject.ext.nodeVersion, which also drives the
    // NODE_VERSION buildConfigField and the downloadMobileNode task.
    implementation "network.mysterium:terms:0.0.50"
    implementation "network.mysterium:mobile-node:${rootProject.ext.nodeVersion}"
}

repositories {
    mavenCentral()
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.incremental", "true")
    arg("room.expandProjection", "true")
}
