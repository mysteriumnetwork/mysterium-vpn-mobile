/**
 * Get the version code from command line param
 *
 * @return int If the param -PversionCode is present then return int value or 1
 */
def getVersionCode = { ->

    def code = project.hasProperty('versionCode') ? versionCode.toInteger() : 1

    println "VersionCode is set to $code"

    return code
}

/**
 * Get the version name from command line param
 *
 * @return string If the param -PversionName is present then return string value or "0.1"
 */
def getVersionName = { ->

    def name = project.hasProperty('versionName') ? versionName.toString() : "0.1"

    println "VersionName is set to $name"

    return name
}


android {
    compileSdk libs.versions.compileSdk.get().toInteger()
    ndkVersion libs.versions.ndk.get()

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        // android.util.Log is not mocked in unit tests; return defaults rather
        // than throwing so guard code paths can be exercised.
        unitTests.returnDefaultValues = true
    }


    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId "network.mysterium.vpn"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode getVersionCode()
        versionName getVersionName()
        ndk {
            debugSymbolLevel 'FULL'
            abiFilters "arm64-v8a", "armeabi-v7a", "armeabi", "x86", "x86_64"
        }

        buildConfigField "String", "NODE_VERSION", "\"${libs.versions.node.get()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            // R8 shrinking + obfuscation. Play's DEX optimization report flags
            // builds under 25% obfuscated; with this off the app sat at 1%.
            // shrinkResources is left at its default of false: it does not
            // affect the DEX categories Play scores, and a wrongly dropped
            // resource is a runtime crash, so it wants its own QA pass.
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    flavorDimensions += "default"
    productFlavors {
        playstore {
            dimension = "default"
            buildConfigField "String", "BUILD_VARIANT", "\"playstore\""
        }
        crypto {
            dimension = "default"
            buildConfigField "String", "BUILD_VARIANT", "\"crypto\""
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    lint {
        abortOnError false
    }
    namespace 'network.mysterium.vpn'
}

