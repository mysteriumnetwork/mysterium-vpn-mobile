name: Setup Android CI Environment
description: Shared setup for Android CI jobs
runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'
        cache-dependency-path: |
          android/*.gradle*
          android/gradle/libs.versions.toml
          android/**/gradle-wrapper.properties

    - name: Cache mobile-node AAR
      uses: actions/cache@v4
      with:
        path: android/libs
        key: mobile-node-${{ hashFiles('android/gradle/libs.versions.toml') }}

    # v4 runs on node24 (v3 is node20, now deprecated on GitHub runners).
    # cmdline-tools-version is deliberately unpinned: the old 7302050 pin forced a
    # 2021 sdkmanager that cannot read the current repository schema.
    - uses: android-actions/setup-android@v4
      with:
        packages: "platform-tools platforms;android-37.0 build-tools;36.1.0 ndk;28.2.13676358"

    - run: sdkmanager --list_installed
      shell: bash

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.7'
        bundler-cache: true

    - name: Install Ruby gems
      run: bundle install --frozen
      shell: bash

    - run: fastlane --version
      shell: bash